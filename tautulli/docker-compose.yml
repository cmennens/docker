---
services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /home/cmennens/docker/tautulli/config:/config
      - /home/cmennens/docker/plex/movies:/media
    environment:
      - PUID=1000
      - GUID=1000
      - TZ=America/Chicago
    ports:
      - 8181:8181
...
