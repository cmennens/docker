---
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "9000:9000"
      - "8000:8000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_volume:/data
    networks:
      - portainer_network
    restart: always

volumes:
  portainer_volume:

networks:
  portainer_network:
    driver: bridge  # Specify a network driver (optional, but sometimes required)
...
