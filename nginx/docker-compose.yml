---
services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: 'nginx-proxy-manager'
    restart: unless-stopped
    ports:
      - '80:80'          # HTTP traffic
      - '443:443'        # HTTPS traffic
      - '81:81'          # NPM Web UI
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - /home/cmennens/docker/nginx:/data               
      - /etc/letsencrypt/live/mennens.org:/etc/letsencrypt/live/mennens.org:ro  # SSL certificates (read-only)
...
