---
services:
  # Nginx Proxy Manager service
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: 'nginx-proxy-manager'
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    environment:
      DISABLE_IPV6: 'true'
    user: "1000:1000"  
    volumes:
      - ./data:/data                        
      - /etc/letsencrypt/live/mennens.org:/etc/letsencrypt/live/mennens.org:ro
...
